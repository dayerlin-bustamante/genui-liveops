services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genui-liveops-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genui-liveops-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
